
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veggie Cartoon Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#151c32;border-bottom:1px solid #303b59}
.logo{font-size:23px;font-weight:800;color:#b69cff}
main{padding:16px;max-width:750px;margin:auto}
h1{font-size:26px;margin:22px 0 8px}
p{color:#b9c5dd;line-height:1.6}
.card{background:#172039;border:1px solid #303b59;border-radius:18px;padding:17px;margin:17px 0}
label{display:block;margin-bottom:10px;font-weight:bold}
textarea{width:100%;height:150px;background:#0b1226;color:white;border:1px solid #465475;border-radius:12px;padding:13px;font-size:15px;line-height:1.5}
button{background:#7950e8;color:white;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:bold}
.primary{width:100%;margin-top:13px}
.controls{display:flex;gap:10px;margin-top:12px}
.controls button{flex:1}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:linear-gradient(#75c9fa 0%,#bcecff 65%,#65b86b 65%,#388443 100%)}
.sun{position:absolute;right:12%;top:12%;width:42px;height:42px;border-radius:50%;background:#ffe780;box-shadow:0 0 35px #ffeb8a}
.cloud{position:absolute;top:20%;left:10%;font-size:35px;animation:cloud 12s linear infinite}
.tree{position:absolute;bottom:22%;font-size:62px}
.tree.one{left:3%}.tree.two{right:3%}
.character{position:absolute;bottom:15%;left:28%;font-size:65px;transition:left 1s ease,transform .5s}
.character.walk{animation:bounce .6s ease-in-out infinite alternate}
.friend{position:absolute;bottom:15%;right:18%;font-size:55px}
.caption{position:absolute;bottom:3%;left:5%;width:90%;background:#0009;border-radius:9px;padding:8px;text-align:center;font-size:12px;line-height:1.4}
.progress{font-size:13px;color:#b6c6e4;margin-top:12px}
@keyframes bounce{to{transform:translateY(-12px)}}
@keyframes cloud{to{left:85%}}
</style>
</head>
<body>
<header><div class="logo">✦ Veggie Cartoon Studio</div></header>
<main>
<h1>🎬 Story to Cartoon</h1>
<p>Write a story and watch it turn into a simple animated cartoon.</p>

<section class="card">
<label>Your Story</label>
<textarea id="story" placeholder="Example: A brave boy walked into a magical forest. He met a friendly rabbit. Together they discovered a mysterious castle."></textarea>
<button class="primary" onclick="makeCartoon()">✨ Create Cartoon Scenes</button>
</section>

<section class="card">
<label>🎥 Cartoon Preview</label>
<div class="stage" id="stage">
<div class="sun"> </div>
<div class="cloud">☁️</div>
<div class="tree one">🌳</div>
<div class="tree two">🌲</div>
<div class="character" id="hero">🧒</div>
<div class="friend" id="friend">🐰</div>
<div class="caption" id="caption">Your cartoon will appear here.</div>
</div>
<div class="controls">
<button onclick="playCartoon()">▶ Play</button>
<button onclick="pauseCartoon()">⏸ Pause</button>
<button onclick="restartCartoon()">↻ Restart</button>
</div>
<div class="progress" id="progress">Enter a story to begin.</div>
</section>
</main>

<script>
let scenes=[];
let index=0;
let timer=null;
let playing=false;

function makeCartoon(){
 pauseCartoon();
 const text=document.getElementById("story").value.trim();
 if(!text){
  document.getElementById("progress").textContent="Please write a story first.";
  return;
 }
 scenes=text.match(/[^.!?۔؟]+[.!?۔؟]?/g)||[text];
 scenes=scenes.map(s=>s.trim()).filter(Boolean);
 index=0;
 showScene();
 document.getElementById("progress").textContent=
 "Created "+scenes.length+" cartoon scenes. Press Play.";
}

function showScene(){
 if(!scenes.length)return;
 const sentence=scenes[index];
 document.getElementById("caption").textContent=sentence;
 const hero=document.getElementById("hero");
 const friend=document.getElementById("friend");
 const stage=document.getElementById("stage");
 hero.style.left=(20+(index%4)*12)+"%";
 hero.textContent=/girl|princess|larki/i.test(sentence)?"👧":"🧒";
 friend.textContent=/dragon/i.test(sentence)?"🐉":
 /cat|billi/i.test(sentence)?"🐱":
 /dog|kutta/i.test(sentence)?"🐶":"🐰";
 stage.style.background=/night|raat|dark/i.test(sentence)?
 "linear-gradient(#111b46 0%,#425c9e 65%,#234b38 65%,#163e2a 100%)":
 "linear-gradient(#75c9fa 0%,#bcecff 65%,#65b86b 65%,#388443 100%)";
 document.getElementById("progress").textContent=
 "Scene "+(index+1)+" of "+scenes.length;
}

function playCartoon(){
 if(!scenes.length){
  makeCartoon();
  if(!scenes.length)return;
 }
 if(playing)return;
 playing=true;
 document.getElementById("hero").classList.add("walk");
 timer=setInterval(()=>{
  index++;
  if(index>=scenes.length){
   pauseCartoon();
   document.getElementById("progress").textContent="Cartoon finished!";
   return;
  }
  showScene();
 },3500);
}

function pauseCartoon(){
 playing=false;
 clearInterval(timer);
 timer=null;
 document.getElementById("hero").classList.remove("walk");
}

function restartCartoon(){
 pauseCartoon();
 index=0;
 showScene();
 playCartoon();
}
</script>
</body>
</html>
